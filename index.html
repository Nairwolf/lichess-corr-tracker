<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lichess-corr-tracker — correspondence games</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
  </head>
  <body>
    <header>
      <h1><span class="logo">♞</span> Correspondence games</h1>
      <form id="form">
        <input id="username" placeholder="lichess username" required autocomplete="off" spellcheck="false" />
        <button type="submit">Show</button>
      </form>
    </header>

    <div id="status"></div>

    <main id="content" hidden>
      <section>
        <h2 id="user-title"></h2>
        <div class="period">
          <div id="presets" class="filters"></div>
          <label id="custom-period">or since <input type="date" id="since" /></label>
        </div>
        <div class="cards" id="summary"></div>
      </section>

      <section>
        <h2>Oldest ongoing game</h2>
        <div id="oldest"></div>
      </section>

      <section>
        <h2>A game a day?</h2>
        <div class="legend">
          <i class="missed"></i> missed
          <i class="l1"></i> 1 <i class="l2"></i> 2 <i class="l3"></i> 3+
          <span class="muted">— click a day to see its games</span>
        </div>
        <div id="calendar"></div>
        <h3>Missed days</h3>
        <div id="missed"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Ongoing games and elo over time</h2>
          <div id="chart-series" class="filters"></div>
        </div>
        <div id="ongoing-chart"></div>
      </section>

      <section id="games">
        <div class="section-head">
          <h2>Games</h2>
          <div id="filters" class="filters"></div>
        </div>
        <div id="day-filter"></div>
        <div id="table" class="table-wrap"></div>
      </section>
    </main>

    <img id="preview" alt="" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
